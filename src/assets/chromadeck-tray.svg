<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="ChromaDeck tray icon">
  <title>ChromaDeck tray icon</title>
  <!-- Solid mint tile: reads on both light and dark taskbars at 16px. -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="#5EEAD4"/>
  <!-- Bold "C" cut in the app background colour. Dash geometry:
       2πr = 47.12 at r = 7.5; 285° arc = 37.30, 75° gap = 9.82.
       rotate(37.5) centres the opening on the right. -->
  <circle
    cx="16" cy="16" r="7.5"
    fill="none"
    stroke="#060608"
    stroke-width="5"
    stroke-linecap="butt"
    stroke-dasharray="37.30 9.82"
    transform="rotate(37.5 16 16)"
  />
</svg>
